<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>İskele Marin Sosyal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #070d19;
      --surface: #0f172a;
      --card: #131f36;
      --card-hover: #1b2c4b;
      --border: #243656;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --whatsapp: #25d366;
      --instagram: #e1306c;
      --linkedin: #0a66c2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #10203d 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .wrapper {
      width: 100%;
      max-width: 430px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 26px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .team-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--card);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .team-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .header h1 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
    }

    .link-card:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .icon-box {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-box.wa {
      background: rgba(37, 211, 102, 0.14);
      color: var(--whatsapp);
    }

    .icon-box.ig {
      background: rgba(225, 48, 108, 0.14);
      color: var(--instagram);
    }

    .icon-box.li {
      background: rgba(10, 102, 194, 0.16);
      color: #3b82f6;
    }

    .link-text {
      flex: 1;
      font-size: 1rem;
      font-weight: 600;
    }

    .arrow {
      color: var(--muted);
      font-size: 1.1rem;
    }

    .qr-section {
      border-top: 1px solid var(--border);
      padding-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .qr-label {
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 500;
    }

    .qr-box {
      position: relative;
      width: 196px;
      height: 196px;
      padding: 12px;
      background: #ffffff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-box canvas,
    .qr-box img {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .qr-center-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      background: #ffffff;
      border: 3px solid #ffffff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-center-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <header class="header">
      <div class="team-badge">
        <img id="headerLogo" src="takim-logon.png" alt="İskele Marin Logosu" />
      </div>
      <h1>İskele Marin Sosyal</h1>
    </header>

    <section class="links-list" aria-label="Sosyal Bağlantılar">
      <!-- WhatsApp -->
      <a class="link-card" href="https://chat.whatsapp.com/K4jPWaIdQ02KYU8XLRY7Y3" target="_blank" rel="noopener noreferrer">
        <span class="icon-box wa" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.031 2c-5.516 0-9.969 4.453-9.969 9.969 0 1.766.469 3.484 1.344 5l-1.406 5.141 5.266-1.375c1.469.797 3.109 1.219 4.766 1.219 5.516 0 9.969-4.453 9.969-9.969 0-2.656-1.031-5.156-2.922-7.047-1.875-1.891-4.391-2.922-7.047-2.922zm5.828 14.125c-.25.703-1.438 1.344-1.984 1.422-.516.078-1.172.109-1.891-.125-.438-.141-1-.328-1.719-.641-3.016-1.297-4.984-4.328-5.141-4.531-.141-.203-1.219-1.625-1.219-3.094 0-1.469.766-2.188 1.047-2.484.281-.297.609-.375.813-.375.203 0 .406 0 .578.016.188.016.438-.063.688.516.25.594.859 2.094.938 2.25.078.156.125.344.031.531-.094.203-.141.328-.281.5-.141.172-.297.391-.422.516-.141.141-.297.297-.125.594.172.281.766 1.266 1.641 2.047 1.125 1 2.078 1.313 2.375 1.453.297.141.469.125.641-.078.172-.188.734-.859.938-1.156.188-.297.391-.25.656-.156.266.094 1.703.813 2 .953.297.141.484.219.563.344.078.125.078.719-.172 1.422z"/>
          </svg>
        </span>
        <span class="link-text">WhatsApp</span>
        <span class="arrow">›</span>
      </a>

      <!-- Instagram -->
      <a class="link-card" href="https://instagram.com/isk.marin" target="_blank" rel="noopener noreferrer">
        <span class="icon-box ig" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </span>
        <span class="link-text">Instagram</span>
        <span class="arrow">›</span>
      </a>

      <!-- LinkedIn -->
      <a class="link-card" href="https://www.linkedin.com/company/115867750" target="_blank" rel="noopener noreferrer">
        <span class="icon-box li" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
          </svg>
        </span>
        <span class="link-text">LinkedIn</span>
        <span class="arrow">›</span>
      </a>
    </section>

    <section class="qr-section" aria-label="Sayfa QR Kodu">
      <p class="qr-label">Sayfayı Paylaşmak İçin Tara</p>
      <div class="qr-box">
        <div id="qrcode"></div>
        <div class="qr-center-logo">
          <img id="qrLogo" src="takim-logon.png" alt="Takım Logosu" />
        </div>
      </div>
    </section>
  </main>

  <script>
    // Sayfa yayınlandığında otomatik kendi URL'sini alır;
    // yerel dosyada test ederken sabit bir link vermek istersen aşağıya yazabilirsin.
    const qrTargetUrl =
      window.location.protocol.startsWith("http")
        ? window.location.href
        : "https://chat.whatsapp.com/K4jPWaIdQ02KYU8XLRY7Y3";

    new QRCode(document.getElementById("qrcode"), {
      text: qrTargetUrl,
      width: 172,
      height: 172,
      colorDark: "#070d19",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
